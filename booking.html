<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment – Knights Barbers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --cream: #F5EDD8;
            --black: #0A0A0A;
            --dark: #111111;
            --dark2: #1A1A1A;
            --text-muted: rgba(245,237,216,0.55);
        }

        body {
            background: var(--black);
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8%;
            border-bottom: 1px solid rgba(201,168,76,0.2);
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(12px);
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--cream); }
        .logo-sub { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(201,168,76,0.4);
            color: var(--gold);
            padding: 9px 20px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .btn-back:hover { background: var(--gold); color: var(--black); }

        .barber-hero {
            text-align: center;
            padding: 60px 8% 20px;
        }

        .barber-hero img {
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
            animation: heroFade 1.4s ease forwards;
        }

        @keyframes heroFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            text-align: center;
            padding: 40px 8% 0;
        }

        .page-tag {
            font-size: 11px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .page-tag::before, .page-tag::after {
            content: ''; width: 30px; height: 1px; background: var(--gold);
        }

        .page-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 5vw, 60px);
            font-weight: 700;
        }

        /* ─── BOOKING LAYOUT ─── */
        .booking-layout {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 60px;
            padding: 60px 8% 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .info-panel {
            padding-top: 10px;
        }

        .info-panel h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 24px;
            color: var(--cream);
        }

        .hours-list { list-style: none; }

        .hours-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(245,237,216,0.08);
            font-size: 14px;
            color: var(--text-muted);
        }

        .hours-item .day { color: var(--cream); font-weight: 500; }

        .payment-icons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .payment-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
            padding: 14px 16px;
            border: 1px solid rgba(245,237,216,0.1);
            border-radius: 4px;
        }

        .payment-item i { color: var(--gold); font-size: 18px; }

        /* ─── FORM ─── */
        .form-panel {
            background: var(--dark2);
            border: 1px solid rgba(201,168,76,0.15);
            border-radius: 4px;
            padding: 44px 40px;
        }

        .form-panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .form-input {
            background: rgba(245,237,216,0.05);
            border: 1px solid rgba(245,237,216,0.15);
            border-radius: 2px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            width: 100%;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .form-input option { background: var(--dark2); color: var(--cream); }

        .btn-submit {
            width: 100%;
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-submit:hover { background: var(--gold-light); transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg {
            background: rgba(255,77,77,0.15);
            border: 1px solid rgba(255,77,77,0.4);
            color: #ff8080;
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .field-error {
            color: #ff8080;
            font-size: 12px;
        }

        /* ─── POPUP ─── */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup-box {
            background: var(--dark2);
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 4px;
            padding: 44px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .popup-box h3 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            margin-bottom: 24px;
        }

        .popup-details {
            background: rgba(201,168,76,0.05);
            border: 1px solid rgba(201,168,76,0.15);
            border-radius: 2px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .popup-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(245,237,216,0.08);
            font-size: 14px;
        }

        .popup-detail-row:last-child { border-bottom: none; }
        .popup-detail-row span:first-child { color: var(--text-muted); }
        .popup-detail-row span:last-child { color: var(--cream); font-weight: 500; }

        .popup-btns { display: flex; gap: 12px; }

        .btn-confirm {
            flex: 1;
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: 0.3s;
        }

        .btn-confirm:hover { background: var(--gold-light); }
        .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(245,237,216,0.2);
            color: var(--cream);
            padding: 14px;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: 0.3s;
        }

        .btn-cancel:hover { border-color: rgba(245,237,216,0.5); }

        .success-icon { font-size: 48px; margin-bottom: 16px; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .booking-layout { grid-template-columns: 1fr; gap: 40px; padding: 40px 6% 80px; }
            .form-panel { padding: 32px 24px; }
        }

        @media (max-width: 600px) {
            nav { padding: 16px 5%; }
            .barber-hero { padding: 40px 5% 10px; }
        }
    </style>
</head>
<body>

<nav>
    <div>
        <div class="logo">Knights Barbers</div>
        <div class="logo-sub">Glasgow</div>
    </div>
    <a href="home.html" class="btn-back">← Back Home</a>
</nav>

<div class="barber-hero">
    <img src="images/barber.png" alt="Knights Barbers">
</div>

<div class="page-title">
    <div class="page-tag">Reserve Your Slot</div>
    <h1>Book an Appointment</h1>
</div>

<div id="booking-root"></div>

<script type="text/babel">
const { useState } = React;

function BookingForm() {
    const [formData, setFormData] = useState({ name: "", phone: "", time: "" });
    const [showPopup, setShowPopup] = useState(false);
    const [showSuccess, setShowSuccess] = useState(false);
    const [phoneError, setPhoneError] = useState("");
    const [errorMessage, setErrorMessage] = useState("");
    const [loading, setLoading] = useState(false);

    function handleChange(e) {
        setFormData({ ...formData, [e.target.name]: e.target.value });
        if (e.target.name === "phone") setPhoneError("");
        setErrorMessage("");
    }

    function validateUKPhone(phone) {
        return /^(?:0|\+44)\d{9,10}$/.test(phone.replace(/\s+/g, ""));
    }

    function handleSubmit(e) {
        e.preventDefault();
        if (!validateUKPhone(formData.phone)) { setPhoneError("Please enter a valid UK phone number"); return; }
        if (formData.time < "09:00" || formData.time > "18:30") { setErrorMessage("Please choose a time during opening hours (9am–6:30pm)"); return; }
        setShowPopup(true);
    }

    async function confirmBooking() {
        setLoading(true);
        try {
            const response = await fetch("https://barber-website-d8re.onrender.com/book", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });
            const data = await response.json();
            if (!response.ok) { setErrorMessage(data.message || "Booking failed"); setShowPopup(false); setLoading(false); return; }
            setShowPopup(false);
            setShowSuccess(true);
            setErrorMessage("");
            setFormData({ name: "", phone: "", time: "" });
        } catch (err) {
            setErrorMessage("Server error. Please try again.");
        }
        setLoading(false);
    }

    const times = ["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00"];

    return (
        <div className="booking-layout">

            {/* LEFT - Hours */}
            <div className="info-panel">
                <h3>Opening Hours</h3>
                <ul className="hours-list">
                    {[
                        ["Monday", "9am – 6pm"],
                        ["Tuesday", "9am – 6pm"],
                        ["Wednesday", "9am – 6pm"],
                        ["Thursday", "9am – 6:30pm"],
                        ["Friday", "9am – 6:30pm"],
                        ["Saturday", "9am – 6pm"],
                        ["Sunday", "10am – 5pm"],
                    ].map(([day, hours]) => (
                        <li key={day} className="hours-item">
                            <span className="day">{day}</span>
                            <span>{hours}</span>
                        </li>
                    ))}
                </ul>
            </div>

            {/* CENTER - Form */}
            <div className="form-panel">
                <h2>Reserve Your Appointment</h2>
                <p className="form-subtitle">We'll confirm via phone or text</p>

                {errorMessage && <div className="error-msg">{errorMessage}</div>}

                <form onSubmit={handleSubmit}>
                    <div className="form-group">
                        <label className="form-label">Full Name</label>
                        <input className="form-input" type="text" name="name" placeholder="Your name" value={formData.name} required onChange={handleChange} />
                    </div>

                    <div className="form-group">
                        <label className="form-label">Phone Number</label>
                        <input className="form-input" type="tel" name="phone" placeholder="UK phone number" value={formData.phone} required onChange={handleChange} />
                        {phoneError && <span className="field-error">{phoneError}</span>}
                    </div>

                    <div className="form-group">
                        <label className="form-label">Preferred Time</label>
                        <select className="form-input" name="time" value={formData.time} required onChange={handleChange}>
                            <option value="">Select a time slot</option>
                            {times.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>

                    <button type="submit" className="btn-submit">Request Booking</button>
                </form>
            </div>

            {/* RIGHT - Payment */}
            <div className="info-panel">
                <h3>Payment Methods</h3>
                <div className="payment-icons">
                    <div className="payment-item">
                        <i className="fas fa-money-bill-wave"></i>
                        <span>Cash</span>
                    </div>
                    <div className="payment-item">
                        <i className="fas fa-university"></i>
                        <span>Bank Transfer</span>
                    </div>
                </div>
            </div>

            {/* CONFIRM POPUP */}
            {showPopup && (
                <div className="popup-overlay">
                    <div className="popup-box">
                        <h3>Confirm Booking</h3>
                        <div className="popup-details">
                            <div className="popup-detail-row">
                                <span>Name</span><span>{formData.name}</span>
                            </div>
                            <div className="popup-detail-row">
                                <span>Phone</span><span>{formData.phone}</span>
                            </div>
                            <div className="popup-detail-row">
                                <span>Time</span><span>{formData.time}</span>
                            </div>
                        </div>
                        <div className="popup-btns">
                            <button className="btn-confirm" onClick={confirmBooking} disabled={loading}>
                                {loading ? "Sending..." : "Confirm"}
                            </button>
                            <button className="btn-cancel" onClick={() => setShowPopup(false)}>Cancel</button>
                        </div>
                    </div>
                </div>
            )}

            {/* SUCCESS POPUP */}
            {showSuccess && (
                <div className="popup-overlay">
                    <div className="popup-box">
                        <div className="success-icon">✅</div>
                        <h3>Booking Sent</h3>
                        <p style={{color: 'var(--text-muted)', fontSize: '15px', margin: '12px 0 28px'}}>
                            Your barber will contact you by phone or text to confirm.
                        </p>
                        <button className="btn-confirm" onClick={() => { setShowSuccess(false); setFormData({ name: "", phone: "", time: "" }); }}>
                            Done
                        </button>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById("booking-root"));
root.render(<BookingForm />);
</script>
</body>
</html>
